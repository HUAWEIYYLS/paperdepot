name: Feature request
description: 提出一个功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先说明要解决的问题，而不是只写实现方式。
        路线图里的批量队列 / provider UI / lint / 概念半自动等属于后续计划。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      placeholder: "我在……场景下遇到了……"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 截图、相关论文/库规模、DSH 版本等。
    validations:
      required: false
